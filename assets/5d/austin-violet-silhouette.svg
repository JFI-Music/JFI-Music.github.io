<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Austin skyline and Pennybacker Bridge at night</title>
  <desc id="desc">A mythological violet Austin skyline featuring Frost Bank Tower, the Austonian, the Texas Capitol, Pennybacker Bridge, Hill Country silhouettes, the river, and luminous signal paths.</desc>
  <defs>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25133b"/>
      <stop offset="1" stop-color="#05040a"/>
    </linearGradient>
    <linearGradient id="frostGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20183d"/>
      <stop offset=".45" stop-color="#102f50"/>
      <stop offset="1" stop-color="#090614"/>
    </linearGradient>
    <linearGradient id="austonianGlass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a0712"/>
      <stop offset=".48" stop-color="#25133c"/>
      <stop offset=".78" stop-color="#18304b"/>
      <stop offset="1" stop-color="#08050e"/>
    </linearGradient>
    <linearGradient id="bridgeSteel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7046c8"/>
      <stop offset=".48" stop-color="#d14fba"/>
      <stop offset=".76" stop-color="#cf7d92"/>
      <stop offset="1" stop-color="#66cfff"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06040c"/>
      <stop offset=".42" stop-color="#28164b"/>
      <stop offset=".68" stop-color="#0b3b58"/>
      <stop offset="1" stop-color="#07040d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7a42ff"/>
      <stop offset=".5" stop-color="#ff3ea5"/>
      <stop offset="1" stop-color="#56d9ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="landmarkGlow" x="-80%" y="-60%" width="260%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hill Country and the quieter downtown mass. -->
  <path d="M0 315 110 280 205 300 315 245 430 290 520 260 620 305 720 272 820 307 920 268 1035 310 1110 276 1210 306 1325 270 1440 303 1600 275 1600 365 0 365Z" fill="#08060e"/>
  <path d="M0 342h76v-52h24v52h32v-112h46v112h39v-76h26v76h42v-136h55v136h32v-88h31v88h42v-58h36v58h41v-103h30v103h40v-73h27v73h34v-125h35v125h32v-91h25v91h31v-66h27v66h28v-102h25v102h38v-60h22v60h42v-128h31v128h42v-72h25v72h38v-97h31v97h45v-65h26v65h45v-88h43v88h58v-44h46v44h81v86H0Z" fill="url(#skyline)"/>

  <!-- Frost Bank Tower: blue-glass shaft and four-faceted crown. -->
  <g id="frost-bank-tower" stroke-linejoin="round">
    <path d="M390 342V205h17v-26l17-20 8-43 14 39 16-25 17 25 14-39 9 43 17 20v26h17v137Z" fill="url(#frostGlass)" stroke="#5fbde2" stroke-width="2" opacity=".96"/>
    <path d="M407 205 446 155l16 50 17-50 40 50M432 116l30 89 31-89M462 130v212" fill="none" stroke="#9ee9ff" stroke-width="1.5" opacity=".62"/>
    <path d="M403 226h120M403 254h120M403 282h120M403 310h120" fill="none" stroke="#6e5bb2" stroke-width="1" opacity=".35"/>
    <path d="M448 178 462 162l14 16-14 16Z" fill="#a9efff" opacity=".65" filter="url(#landmarkGlow)"/>
  </g>

  <!-- The Austonian: tall, slender, curved residential tower. -->
  <g id="the-austonian" stroke-linejoin="round">
    <path d="M560 342V174c0-41 16-67 47-79 31 12 47 38 47 79v168Z" fill="url(#austonianGlass)" stroke="#a46fe0" stroke-width="2" opacity=".96"/>
    <path d="M578 342V170c0-30 10-51 29-65M636 342V170c0-30-10-51-29-65" fill="none" stroke="#75c9f3" stroke-width="1.4" opacity=".47"/>
    <g fill="none" stroke="#b482e8" stroke-width="1" opacity=".38">
      <path d="M569 151q38 10 76 0"/><path d="M563 176q44 10 88 0"/><path d="M562 202q45 9 90 0"/><path d="M562 228q45 9 90 0"/><path d="M562 254q45 9 90 0"/><path d="M562 280q45 9 90 0"/><path d="M562 306q45 9 90 0"/>
    </g>
    <ellipse cx="607" cy="111" rx="5" ry="4" fill="#ff79c1" opacity=".8" filter="url(#landmarkGlow)"/>
  </g>

  <!-- Texas Capitol, kept as the civic center of the composition. -->
  <g id="texas-capitol" fill="#120b21" stroke="#8d5bc0" stroke-width="2" opacity=".94" stroke-linejoin="round">
    <path d="M738 342v-118h18v-34h13v-30h12v30h13v34h19v118Z"/>
    <path d="M751 224q26-44 51 0Z"/>
    <path d="M769 160h13v-26h-13z"/>
    <path d="M775 134v-19"/>
  </g>

  <!-- Pennybacker / 360 Bridge: twin arch ribs, suspended road deck, hangers, and abutments. -->
  <g id="pennybacker-bridge" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1050 335C1122 208 1208 164 1300 164s184 44 264 171" fill="none" stroke="#15101e" stroke-width="25"/>
    <path d="M1050 335C1122 208 1208 164 1300 164s184 44 264 171" fill="none" stroke="url(#bridgeSteel)" stroke-width="5" opacity=".9" filter="url(#landmarkGlow)"/>
    <path d="M1062 335C1130 226 1212 188 1300 188s176 38 252 147" fill="none" stroke="#8f62ca" stroke-width="2" opacity=".7"/>
    <g fill="none" stroke="#9e75d2" stroke-width="2" opacity=".82">
      <path d="M1092 277v56"/><path d="M1135 230v103"/><path d="M1182 196v137"/><path d="M1232 174v159"/><path d="M1282 164v169"/><path d="M1332 167v166"/><path d="M1382 179v154"/><path d="M1432 205v128"/><path d="M1480 248v85"/><path d="M1522 294v39"/>
    </g>
    <path d="M1032 333H1575" fill="none" stroke="#171020" stroke-width="23"/>
    <path d="M1032 329H1575" fill="none" stroke="url(#bridgeSteel)" stroke-width="3" opacity=".9"/>
    <path d="M1068 338h464" fill="none" stroke="#4b315e" stroke-width="2" stroke-dasharray="18 13" opacity=".75"/>
    <path d="M1016 343h74v-17h-48ZM1543 343h57v-17h-76Z" fill="#09060f" stroke="#5b3c7b" stroke-width="2"/>
  </g>

  <!-- River and the dimensional signal moving through the city. -->
  <path d="M0 348q260 36 505 4t430 6q300 42 665-7v169H0Z" fill="url(#river)"/>
  <path d="M-20 384q230-48 430 5t371-2q215-62 408 2t431-5" fill="none" stroke="url(#signal)" stroke-width="5" opacity=".88" filter="url(#glow)"/>
  <path d="M65 420q210-36 397 1t351-3q192-44 352 3t372-6" fill="none" stroke="#7c5cff" stroke-width="1.5" opacity=".5"/>
  <g fill="#ff76bc" opacity=".94" filter="url(#landmarkGlow)">
    <circle cx="118" cy="320" r="2"/><circle cx="362" cy="276" r="2"/><circle cx="462" cy="205" r="2.5"/><circle cx="607" cy="111" r="2.5"/><circle cx="775" cy="115" r="2"/><circle cx="934" cy="297" r="2"/><circle cx="1188" cy="289" r="2"/><circle cx="1455" cy="319" r="2"/>
  </g>
</svg>

  <path d="M-20 384q230-48 430 5t371-2q215-62 408 2t431-5" fill="none" stroke="url(#signal)" stroke-width="5" opacity=".85" filter="url(#glow)"/>
  <path d="M65 420q210-36 397 1t351-3q192-44 352 3t372-6" fill="none" stroke="#7c5cff" stroke-width="1.5" opacity=".5"/>
  <g fill="#ff76bc" opacity=".9">
    <circle cx="118" cy="320" r="2"/><circle cx="362" cy="276" r="2"/><circle cx="589" cy="311" r="2"/><circle cx="808" cy="244" r="3"/><circle cx="934" cy="297" r="2"/><circle cx="1188" cy="289" r="2"/><circle cx="1455" cy="319" r="2"/>
